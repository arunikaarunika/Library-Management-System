<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h1>Add a book</h1>
<form action="MainServlet" method="post">
<label>ISBN Number</label>
<input type="text" name="isbn"><br>
<label>Book Name:</label>
<input type="text" name="bookname" required><br>
<label>Book Type</label>
<select name="bookType">
<option value="G">General</option>
<option value="T">Technical</select><br>
<label>Author Name:</label>
<select name="authorName">
   <option value="RobinSharma">RobinSharma</option>
   <option value="R.K.Naraynan">R.K.Naraynan</option>
   <option value="PauloCoelho">PauloCoelho</option>
</select><br>
<label>Book Cost</label>
<input type="number" name="cost">
<input type="submit" name="operation" value="AddBook">
</form>
</body>
</html>
